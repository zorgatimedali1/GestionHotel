<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head><title>Services Extra – Hotel Master</title></head>
<body>
<section>
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="page-title mb-0"><i class="fas fa-concierge-bell me-2 text-secondary"></i>Services Extra</h2>
        <a th:href="@{/services-extra/nouveau}" class="btn btn-secondary">
            <i class="fas fa-plus me-1"></i>Nouveau Service
        </a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div th:if="${#lists.isEmpty(services)}" class="alert alert-warning m-3">
                <i class="fas fa-exclamation-triangle me-2"></i>Aucun service enregistré.
            </div>
            <table class="table table-hover mb-0" th:unless="${#lists.isEmpty(services)}">
                <thead class="table-dark">
                <tr>
                    <th>#</th>
                    <th>Icône</th>
                    <th>Nom</th>
                    <th>Description</th>
                    <th>Prix</th>
                    <th class="text-center">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="s : ${services}">
                    <td class="text-muted small" th:text="${s.id}"></td>
                    <td>
                        <i th:classappend="${s.icone}" class="fas fa-lg text-info"></i>
                    </td>
                    <td class="fw-semibold" th:text="${s.nom}"></td>
                    <td class="text-muted" th:text="${s.description}"></td>
                    <td th:text="${s.prix} + ' €'"></td>
                    <td class="text-center">
                        <a th:href="@{/services-extra/modifier/{id}(id=${s.id})}" class="btn btn-sm btn-outline-warning me-1">
                            <i class="fas fa-edit"></i>
                        </a>
                        <a th:href="@{/services-extra/supprimer/{id}(id=${s.id})}" class="btn btn-sm btn-outline-danger"
                           onclick="return confirm('Supprimer ce service ?')">
                            <i class="fas fa-trash"></i>
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</section>
</body>
</html>
