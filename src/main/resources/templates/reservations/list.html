<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head><title>Réservations – Hotel Master</title></head>
<body>
<section>
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="page-title mb-0"><i class="fas fa-calendar-check me-2 text-success"></i>Gestion des Réservations</h2>
        <a th:href="@{/reservations/nouveau}" class="btn btn-success">
            <i class="fas fa-plus me-1"></i>Nouvelle Réservation
        </a>
    </div>

    <form th:action="@{/reservations}" method="get" class="mb-4">
        <div class="input-group shadow-sm" style="max-width:450px">
            <span class="input-group-text bg-white border-end-0"><i class="fas fa-search text-muted"></i></span>
            <input type="text" name="mc" class="form-control border-start-0"
                   placeholder="Rechercher par client ou email…" th:value="${mc}"/>
            <button type="submit" class="btn btn-success">Rechercher</button>
            <a th:href="@{/reservations}" class="btn btn-outline-secondary"><i class="fas fa-times"></i></a>
        </div>
    </form>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div th:if="${#lists.isEmpty(reservations)}" class="alert alert-warning m-3">
                <i class="fas fa-exclamation-triangle me-2"></i>Aucune réservation trouvée.
            </div>
            <table class="table table-hover mb-0" th:unless="${#lists.isEmpty(reservations)}">
                <thead class="table-dark">
                <tr>
                    <th>#</th>
                    <th>Client</th>
                    <th>Chambre</th>
                    <th>Arrivée</th>
                    <th>Départ</th>
                    <th>Services</th>
                    <th>Montant</th>
                    <th>Statut</th>
                    <th class="text-center">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="r : ${reservations}">
                    <td class="text-muted small" th:text="${r.id}"></td>
                    <td>
                        <div class="fw-semibold" th:text="${r.prenomClient} + ' ' + ${r.nomClient}"></div>
                        <small class="text-muted" th:text="${r.emailClient}"></small>
                    </td>
                    <td th:text="${r.chambre != null} ? ${r.chambre.numero} + ' (' + ${r.chambre.type} + ')' : '—'"></td>
                    <td th:text="${r.dateArrivee}"></td>
                    <td th:text="${r.dateDepart}"></td>
                    <td>
                        <span th:each="s : ${r.servicesExtra}"
                              class="badge text-bg-info me-1"
                              th:text="${s.nom}"></span>
                    </td>
                    <td class="fw-semibold" th:text="${r.montantTotal != null} ? ${#numbers.formatDecimal(r.montantTotal,1,2)} + ' €' : '—'"></td>
                    <td>
                        <span class="badge"
                              th:classappend="${r.statut == 'CONFIRMÉE'} ? 'text-bg-success' : (${r.statut == 'ANNULÉE'} ? 'text-bg-danger' : 'text-bg-warning')"
                              th:text="${r.statut}"></span>
                    </td>
                    <td class="text-center">
                        <a th:href="@{/reservations/modifier/{id}(id=${r.id})}" class="btn btn-sm btn-outline-warning me-1">
                            <i class="fas fa-edit"></i>
                        </a>
                        <a th:href="@{/reservations/supprimer/{id}(id=${r.id})}" class="btn btn-sm btn-outline-danger"
                           onclick="return confirm('Supprimer cette réservation ?')">
                            <i class="fas fa-trash"></i>
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Pagination -->
    <nav class="mt-3" th:if="${reservationsPage.totalPages > 1}">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                <a class="page-link" th:href="@{/reservations(mc=${mc}, page=${currentPage - 1})}">«</a>
            </li>
            <li class="page-item" th:each="i : ${pages}"
                th:classappend="${i == currentPage} ? 'active'">
                <a class="page-link" th:href="@{/reservations(mc=${mc}, page=${i})}" th:text="${i + 1}"></a>
            </li>
            <li class="page-item" th:classappend="${currentPage + 1 == reservationsPage.totalPages} ? 'disabled'">
                <a class="page-link" th:href="@{/reservations(mc=${mc}, page=${currentPage + 1})}">»</a>
            </li>
        </ul>
        <p class="text-center text-muted small">
            Page <span th:text="${currentPage + 1}"></span> / <span th:text="${reservationsPage.totalPages}"></span>
        </p>
    </nav>
</section>
</body>
</html>
