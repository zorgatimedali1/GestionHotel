<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head><title>Gestion Hôtel – Hotel Master</title></head>
<body>
<section>
    <div class="d-flex justify-content-between align-items-center mb-4">
        <!-- ✅ FIX 3 : renommé "Gestion Hôtel" -->
        <h2 class="page-title mb-0"><i class="fas fa-hotel me-2 text-primary"></i>Gestion Hôtel</h2>
        <!-- ✅ Bouton Nouvel Hôtel visible ADMIN seulement -->
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/hotels/nouveau}" class="btn btn-primary">
            <i class="fas fa-plus me-1"></i>Nouvel Hôtel
        </a>
    </div>

    <!-- Barre de recherche -->
    <form th:action="@{/hotels}" method="get" class="mb-4">
        <div class="input-group shadow-sm" style="max-width:450px">
            <span class="input-group-text bg-white border-end-0"><i class="fas fa-search text-muted"></i></span>
            <input type="text" name="mc" class="form-control border-start-0"
                   placeholder="Rechercher par nom ou ville…" th:value="${mc}"/>
            <button type="submit" class="btn btn-primary">Rechercher</button>
            <a th:href="@{/hotels}" class="btn btn-outline-secondary"><i class="fas fa-times"></i></a>
        </div>
    </form>

    <!-- Tableau -->
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div th:if="${#lists.isEmpty(hotels)}" class="alert alert-warning m-3">
                <i class="fas fa-exclamation-triangle me-2"></i>Aucun hôtel trouvé.
            </div>
            <table class="table table-hover mb-0" th:unless="${#lists.isEmpty(hotels)}">
                <thead class="table-dark">
                <tr>
                    <th>#</th>
                    <th>Photo</th>
                    <th>Nom</th>
                    <th>Ville / Pays</th>
                    <th>Étoiles</th>
                    <th>Téléphone</th>
                    <th class="text-center">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="h : ${hotels}">
                    <td class="text-muted small" th:text="${h.id}"></td>
                    <td>
                        <!-- ✅ FIX IMAGE : vérification robuste avant affichage -->
                        <img th:if="${h.photo != null and !h.photo.isEmpty()}"
                             th:src="@{/uploads/{p}(p=${h.photo})}"
                             class="rounded shadow-sm" width="55" height="45" style="object-fit:cover" alt="photo"/>
                        <span th:unless="${h.photo != null and !h.photo.isEmpty()}" class="text-muted small">—</span>
                    </td>
                    <td class="fw-semibold" th:text="${h.nom}"></td>
                    <td th:text="${h.ville} + ', ' + ${h.pays}"></td>
                    <td>
                        <span th:each="i : ${#numbers.sequence(1, h.etoiles)}"
                              class="text-warning"><i class="fas fa-star fa-sm"></i></span>
                    </td>
                    <td th:text="${h.telephone}"></td>
                    <td class="text-center">
                        <a th:href="@{/hotels/detail/{id}(id=${h.id})}" class="btn btn-sm btn-outline-info me-1" title="Détail">
                            <i class="fas fa-eye"></i>
                        </a>
                        <!-- Modifier / Supprimer : ADMIN seulement -->
                        <a sec:authorize="hasRole('ADMIN')"
                           th:href="@{/hotels/modifier/{id}(id=${h.id})}" class="btn btn-sm btn-outline-warning me-1" title="Modifier">
                            <i class="fas fa-edit"></i>
                        </a>
                        <a sec:authorize="hasRole('ADMIN')"
                           th:href="@{/hotels/supprimer/{id}(id=${h.id})}" class="btn btn-sm btn-outline-danger"
                           title="Supprimer" onclick="return confirm('Supprimer cet hôtel et toutes ses chambres ?')">
                            <i class="fas fa-trash"></i>
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Pagination -->
    <nav class="mt-3" th:if="${hotelsPage.totalPages > 1}">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                <a class="page-link" th:href="@{/hotels(mc=${mc}, page=${currentPage - 1})}">«</a>
            </li>
            <li class="page-item" th:each="i : ${pages}"
                th:classappend="${i == currentPage} ? 'active'">
                <a class="page-link" th:href="@{/hotels(mc=${mc}, page=${i})}" th:text="${i + 1}"></a>
            </li>
            <li class="page-item" th:classappend="${currentPage + 1 == hotelsPage.totalPages} ? 'disabled'">
                <a class="page-link" th:href="@{/hotels(mc=${mc}, page=${currentPage + 1})}">»</a>
            </li>
        </ul>
        <p class="text-center text-muted small">
            Page <span th:text="${currentPage + 1}"></span> / <span th:text="${hotelsPage.totalPages}"></span>
            — <span th:text="${hotelsPage.totalElements}"></span> hôtel(s) trouvé(s)
        </p>
    </nav>
</section>
</body>
</html>
