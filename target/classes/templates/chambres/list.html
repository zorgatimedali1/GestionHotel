<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head><title>Chambres – Hotel Master</title></head>
<body>
<section>
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="page-title mb-0"><i class="fas fa-bed me-2 text-info"></i>Gestion des Chambres</h2>
        <a th:href="@{/chambres/nouveau}" class="btn btn-info text-white">
            <i class="fas fa-plus me-1"></i>Nouvelle Chambre
        </a>
    </div>

    <!-- ✅ FIX 4 : Barre de filtres (recherche texte + dropdown hôtel) -->
    <form th:action="@{/chambres}" method="get" class="mb-4">
        <div class="row g-2 align-items-end">

            <!-- Recherche texte -->
            <div class="col-md-5">
                <label class="form-label small text-muted fw-semibold">Recherche</label>
                <div class="input-group shadow-sm">
                    <span class="input-group-text bg-white border-end-0">
                        <i class="fas fa-search text-muted"></i>
                    </span>
                    <input type="text" name="mc" class="form-control border-start-0"
                           placeholder="Rechercher par numéro ou type…" th:value="${mc}"/>
                </div>
            </div>

            <!-- ✅ Dropdown filtre par hôtel -->
            <div class="col-md-4">
                <label class="form-label small text-muted fw-semibold">
                    <i class="fas fa-hotel me-1 text-primary"></i>Filtrer par Hôtel
                </label>
                <select name="hotelId" class="form-select shadow-sm">
                    <option value="">— Tous les hôtels —</option>
                    <option th:each="h : ${hotelsFiltre}"
                            th:value="${h.id}"
                            th:text="${h.nom} + ' (' + ${h.ville} + ')'"
                            th:selected="${h.id == hotelId}">
                    </option>
                </select>
            </div>

            <!-- Boutons -->
            <div class="col-md-3 d-flex gap-2">
                <button type="submit" class="btn btn-info text-white flex-grow-1">
                    <i class="fas fa-filter me-1"></i>Filtrer
                </button>
                <a th:href="@{/chambres}" class="btn btn-outline-secondary" title="Réinitialiser">
                    <i class="fas fa-times"></i>
                </a>
            </div>
        </div>

        <!-- Badge filtre actif -->
        <div th:if="${hotelId != null}" class="mt-2">
            <span class="badge text-bg-primary">
                <i class="fas fa-hotel me-1"></i>
                Filtre actif :
                <span th:each="h : ${hotelsFiltre}" th:if="${h.id == hotelId}" th:text="${h.nom}"></span>
                <a th:href="@{/chambres(mc=${mc})}" class="text-white ms-2" title="Supprimer ce filtre">
                    <i class="fas fa-times"></i>
                </a>
            </span>
        </div>
    </form>

    <!-- Table -->
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div th:if="${#lists.isEmpty(chambres)}" class="alert alert-warning m-3">
                <i class="fas fa-exclamation-triangle me-2"></i>Aucune chambre trouvée.
            </div>
            <table class="table table-hover mb-0" th:unless="${#lists.isEmpty(chambres)}">
                <thead class="table-dark">
                <tr>
                    <th>#</th>
                    <th>Photo</th>
                    <th>Numéro</th>
                    <th>Type</th>
                    <th>Hôtel</th>
                    <th>Prix / Nuit</th>
                    <th>Statut</th>
                    <th class="text-center">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="c : ${chambres}">
                    <td class="text-muted small" th:text="${c.id}"></td>
                    <td>
                        <!-- ✅ FIX IMAGE : vérification robuste -->
                        <img th:if="${c.photo != null and !c.photo.isEmpty()}"
                             th:src="@{/uploads/{p}(p=${c.photo})}"
                             class="rounded shadow-sm" width="55" height="45" style="object-fit:cover" alt="chambre"/>
                        <span th:unless="${c.photo != null and !c.photo.isEmpty()}" class="text-muted small">—</span>
                    </td>
                    <td class="fw-semibold" th:text="${c.numero}"></td>
                    <td th:text="${c.type}"></td>
                    <td>
                        <span th:if="${c.hotel != null}"
                              class="badge text-bg-light text-dark border"
                              th:text="${c.hotel.nom}"></span>
                        <span th:unless="${c.hotel != null}" class="text-muted small">—</span>
                    </td>
                    <td class="fw-semibold" th:text="${c.prixParNuit} + ' €'"></td>
                    <td>
                        <span th:if="${c.disponible}" class="badge text-bg-success">Disponible</span>
                        <span th:unless="${c.disponible}" class="badge text-bg-danger">Occupée</span>
                    </td>
                    <td class="text-center">
                        <a th:href="@{/chambres/details/{id}(id=${c.id})}"
                           class="btn btn-sm btn-outline-secondary me-1" title="Fiche technique">
                            <i class="fas fa-clipboard-list"></i>
                        </a>
                        <a th:href="@{/chambres/modifier/{id}(id=${c.id})}"
                           class="btn btn-sm btn-outline-warning me-1" title="Modifier">
                            <i class="fas fa-edit"></i>
                        </a>
                        <a th:href="@{/chambres/supprimer/{id}(id=${c.id})}"
                           class="btn btn-sm btn-outline-danger" title="Supprimer"
                           onclick="return confirm('Supprimer cette chambre ?')">
                            <i class="fas fa-trash"></i>
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Pagination (conserve les filtres actifs) -->
    <nav class="mt-3" th:if="${chambresPage.totalPages > 1}">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/chambres(mc=${mc}, hotelId=${hotelId}, page=${currentPage - 1})}">«</a>
            </li>
            <li class="page-item" th:each="i : ${pages}"
                th:classappend="${i == currentPage} ? 'active'">
                <a class="page-link"
                   th:href="@{/chambres(mc=${mc}, hotelId=${hotelId}, page=${i})}"
                   th:text="${i + 1}"></a>
            </li>
            <li class="page-item" th:classappend="${currentPage + 1 == chambresPage.totalPages} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/chambres(mc=${mc}, hotelId=${hotelId}, page=${currentPage + 1})}">»</a>
            </li>
        </ul>
        <p class="text-center text-muted small">
            Page <span th:text="${currentPage + 1}"></span> / <span th:text="${chambresPage.totalPages}"></span>
            — <span th:text="${chambresPage.totalElements}"></span> chambre(s)
        </p>
    </nav>
</section>
</body>
</html>
