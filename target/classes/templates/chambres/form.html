<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head><title th:text="${modeEdition} ? 'Modifier Chambre' : 'Nouvelle Chambre'">Chambre</title></head>
<body>
<section>
    <div class="d-flex align-items-center mb-4 gap-3">
        <a th:href="@{/chambres}" class="btn btn-outline-secondary btn-sm">
            <i class="fas fa-arrow-left me-1"></i>Retour
        </a>
        <h2 class="page-title mb-0"
            th:text="${modeEdition} ? 'Modifier la Chambre' : 'Ajouter une Chambre'"></h2>
    </div>

    <div class="card shadow-sm" style="max-width:650px">
        <div class="card-body p-4">
            <form th:action="${modeEdition} ? @{/chambres/update} : @{/chambres/save}"
                  method="post" enctype="multipart/form-data" th:object="${chambre}">

                <input type="hidden" th:field="*{id}"/>
                <!-- ✅ FIX IMAGE : conserver ancienne photo si pas de nouveau fichier -->
                <input type="hidden" th:field="*{photo}"/>

                <div class="row g-3">

                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Numéro <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" th:field="*{numero}"
                               th:classappend="${#fields.hasErrors('numero')} ? 'is-invalid'"/>
                        <div class="invalid-feedback" th:errors="*{numero}"></div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Type <span class="text-danger">*</span></label>
                        <select class="form-select" th:field="*{type}"
                                th:classappend="${#fields.hasErrors('type')} ? 'is-invalid'">
                            <option value="">-- Choisir --</option>
                            <option value="Simple">Simple</option>
                            <option value="Double">Double</option>
                            <option value="Suite">Suite</option>
                            <option value="Familiale">Familiale</option>
                            <option value="Deluxe">Deluxe</option>
                        </select>
                        <div class="invalid-feedback" th:errors="*{type}"></div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Prix / Nuit (€) <span class="text-danger">*</span></label>
                        <input type="number" step="0.01" min="0" class="form-control" th:field="*{prixParNuit}"
                               th:classappend="${#fields.hasErrors('prixParNuit')} ? 'is-invalid'"/>
                        <div class="invalid-feedback" th:errors="*{prixParNuit}"></div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Hôtel <span class="text-danger">*</span></label>
                        <select class="form-select" th:field="*{hotel.id}">
                            <option value="">-- Choisir un hôtel --</option>
                            <option th:each="h : ${hotels}"
                                    th:value="${h.id}"
                                    th:text="${h.nom} + ' (' + ${h.ville} + ')'"></option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Disponibilité</label>
                        <div class="form-check form-switch pt-2">
                            <input class="form-check-input" type="checkbox" th:field="*{disponible}" role="switch"/>
                            <label class="form-check-label">Chambre disponible</label>
                        </div>
                    </div>

                    <div class="col-12">
                        <label class="form-label fw-semibold">Photo de la chambre</label>
                        <input type="file" class="form-control" name="photoFile" accept="image/*"/>
                        <div th:if="${chambre.photo != null}" class="mt-2">
                            <small class="text-muted">Photo actuelle :</small><br/>
                            <img th:src="@{/uploads/{p}(p=${chambre.photo})}"
                                 class="rounded mt-1" height="80" style="object-fit:cover" alt="photo actuelle"/>
                        </div>
                    </div>

                    <div class="col-12 d-flex gap-2 pt-2">
                        <button type="submit" class="btn btn-info text-white">
                            <i class="fas fa-save me-1"></i>
                            <span th:text="${modeEdition} ? 'Mettre à jour' : 'Enregistrer'"></span>
                        </button>
                        <a th:href="@{/chambres}" class="btn btn-outline-secondary">Annuler</a>
                    </div>
                </div>
            </form>
        </div>
    </div>
</section>
</body>
</html>
