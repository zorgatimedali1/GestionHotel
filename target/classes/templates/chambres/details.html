<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head><title>Détails Chambre – Hotel Master</title></head>
<body>
<section>
    <div class="d-flex align-items-center mb-4 gap-3">
        <a th:href="@{/chambres}" class="btn btn-outline-secondary btn-sm">
            <i class="fas fa-arrow-left me-1"></i>Retour
        </a>
        <h2 class="page-title mb-0">
            Fiche Technique — Chambre <span th:text="${chambre.numero}"></span>
        </h2>
    </div>

    <div class="card shadow-sm" style="max-width:600px">
        <div class="card-header bg-secondary text-white fw-semibold">
            <i class="fas fa-clipboard-list me-2"></i>Détails Techniques
        </div>
        <div class="card-body p-4">
            <form th:action="@{/chambres/details/save}" method="post" th:object="${details}">
                <input type="hidden" th:field="*{id}"/>
                <!-- Lier au chambre via un champ caché -->
                <input type="hidden" name="chambre.id" th:value="${chambre.id}"/>

                <div class="row g-3">

                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Superficie (m²) <span class="text-danger">*</span></label>
                        <input type="number" step="0.1" min="5" class="form-control" th:field="*{superficie}"
                               th:classappend="${#fields.hasErrors('superficie')} ? 'is-invalid'"/>
                        <div class="invalid-feedback" th:errors="*{superficie}"></div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Nombre de lits</label>
                        <input type="number" min="1" class="form-control" th:field="*{nombreLits}"/>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Type de vue</label>
                        <select class="form-select" th:field="*{typeVue}">
                            <option value="">-- Aucune --</option>
                            <option value="Mer">Mer</option>
                            <option value="Jardin">Jardin</option>
                            <option value="Ville">Ville</option>
                            <option value="Montagne">Montagne</option>
                            <option value="Piscine">Piscine</option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Équipements</label>
                        <input type="text" class="form-control" th:field="*{descriptionEquipements}"
                               placeholder="ex: TV, Minibar, Jacuzzi..."/>
                    </div>

                    <!-- Switches -->
                    <div class="col-12">
                        <label class="form-label fw-semibold">Options</label>
                        <div class="d-flex flex-wrap gap-4">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" th:field="*{climatisation}" role="switch"/>
                                <label class="form-check-label"><i class="fas fa-wind me-1 text-info"></i>Climatisation</label>
                            </div>
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" th:field="*{balcon}" role="switch"/>
                                <label class="form-check-label"><i class="fas fa-door-open me-1 text-success"></i>Balcon</label>
                            </div>
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" th:field="*{vueMer}" role="switch"/>
                                <label class="form-check-label"><i class="fas fa-water me-1 text-primary"></i>Vue Mer</label>
                            </div>
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" th:field="*{wifiInclus}" role="switch"/>
                                <label class="form-check-label"><i class="fas fa-wifi me-1 text-warning"></i>Wi-Fi Inclus</label>
                            </div>
                        </div>
                    </div>

                    <div class="col-12 d-flex gap-2 pt-2">
                        <button type="submit" class="btn btn-secondary">
                            <i class="fas fa-save me-1"></i>Enregistrer les Détails
                        </button>
                        <a th:href="@{/chambres}" class="btn btn-outline-secondary">Annuler</a>
                    </div>
                </div>
            </form>
        </div>
    </div>
</section>
</body>
</html>
