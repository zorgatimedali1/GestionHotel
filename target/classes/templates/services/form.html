<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head><title th:text="${modeEdition} ? 'Modifier Service' : 'Nouveau Service'">Service Extra</title></head>
<body>
<section>
    <div class="d-flex align-items-center mb-4 gap-3">
        <a th:href="@{/services-extra}" class="btn btn-outline-secondary btn-sm">
            <i class="fas fa-arrow-left me-1"></i>Retour
        </a>
        <h2 class="page-title mb-0"
            th:text="${modeEdition} ? 'Modifier le Service' : 'Ajouter un Service Extra'"></h2>
    </div>

    <div class="card shadow-sm" style="max-width:540px">
        <div class="card-body p-4">
            <form th:action="${modeEdition} ? @{/services-extra/update} : @{/services-extra/save}"
                  method="post" th:object="${service}">

                <input type="hidden" th:field="*{id}"/>

                <div class="row g-3">

                    <div class="col-12">
                        <label class="form-label fw-semibold">Nom <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" th:field="*{nom}"
                               th:classappend="${#fields.hasErrors('nom')} ? 'is-invalid'"/>
                        <div class="invalid-feedback" th:errors="*{nom}"></div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Prix (€) <span class="text-danger">*</span></label>
                        <input type="number" step="0.01" min="0" class="form-control" th:field="*{prix}"
                               th:classappend="${#fields.hasErrors('prix')} ? 'is-invalid'"/>
                        <div class="invalid-feedback" th:errors="*{prix}"></div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Icône FontAwesome</label>
                        <input type="text" class="form-control" th:field="*{icone}"
                               placeholder="ex: fa-spa"/>
                        <div class="form-text">Classe FA sans le préfixe "fas". <a href="https://fontawesome.com/icons" target="_blank">Parcourir ↗</a></div>
                    </div>

                    <div class="col-12">
                        <label class="form-label fw-semibold">Description</label>
                        <textarea class="form-control" th:field="*{description}" rows="3"></textarea>
                    </div>

                    <div class="col-12 d-flex gap-2 pt-2">
                        <button type="submit" class="btn btn-secondary">
                            <i class="fas fa-save me-1"></i>
                            <span th:text="${modeEdition} ? 'Mettre à jour' : 'Enregistrer'"></span>
                        </button>
                        <a th:href="@{/services-extra}" class="btn btn-outline-secondary">Annuler</a>
                    </div>
                </div>
            </form>
        </div>
    </div>
</section>
</body>
</html>
