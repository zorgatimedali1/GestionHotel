<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head><title>Détail Hôtel – Hotel Master</title></head>
<body>
<section>
    <div class="d-flex align-items-center mb-4 gap-3">
        <a th:href="@{/hotels}" class="btn btn-outline-secondary btn-sm">
            <i class="fas fa-arrow-left me-1"></i>Retour
        </a>
        <h2 class="page-title mb-0" th:text="${hotel.nom}"></h2>
    </div>

    <div class="row g-4">
        <!-- Photo -->
        <div class="col-md-4">
            <div class="card shadow-sm">
                <img th:if="${hotel.photo != null}"
                     th:src="@{/uploads/{p}(p=${hotel.photo})}"
                     class="card-img-top" style="height:260px;object-fit:cover" alt="photo hôtel"/>
                <div th:unless="${hotel.photo != null}"
                     class="d-flex align-items-center justify-content-center bg-light"
                     style="height:260px">
                    <i class="fas fa-hotel fa-4x text-muted"></i>
                </div>
                <div class="card-body text-center">
                    <span th:each="i : ${#numbers.sequence(1, hotel.etoiles)}"
                          class="text-warning fs-4"><i class="fas fa-star"></i></span>
                </div>
            </div>
        </div>

        <!-- Infos -->
        <div class="col-md-8">
            <div class="card shadow-sm mb-3">
                <div class="card-header bg-primary text-white fw-semibold">
                    <i class="fas fa-info-circle me-2"></i>Informations Générales
                </div>
                <div class="card-body">
                    <dl class="row mb-0">
                        <dt class="col-sm-4 text-muted">Adresse</dt>
                        <dd class="col-sm-8" th:text="${hotel.adresse}"></dd>
                        <dt class="col-sm-4 text-muted">Ville</dt>
                        <dd class="col-sm-8" th:text="${hotel.ville}"></dd>
                        <dt class="col-sm-4 text-muted">Pays</dt>
                        <dd class="col-sm-8" th:text="${hotel.pays}"></dd>
                        <dt class="col-sm-4 text-muted">Téléphone</dt>
                        <dd class="col-sm-8" th:text="${hotel.telephone}"></dd>
                        <dt class="col-sm-4 text-muted">Email</dt>
                        <dd class="col-sm-8" th:text="${hotel.email}"></dd>
                    </dl>
                </div>
            </div>

            <!-- Liste des chambres de cet hôtel -->
            <div class="card shadow-sm">
                <div class="card-header bg-info text-white fw-semibold">
                    <i class="fas fa-bed me-2"></i>Chambres
                    <span class="badge bg-white text-info ms-2" th:text="${#lists.size(hotel.chambres)}"></span>
                </div>
                <div class="card-body p-0">
                    <div th:if="${#lists.isEmpty(hotel.chambres)}" class="p-3 text-muted">
                        Aucune chambre enregistrée pour cet hôtel.
                    </div>
                    <table class="table table-sm mb-0" th:unless="${#lists.isEmpty(hotel.chambres)}">
                        <thead class="table-light">
                        <tr><th>N°</th><th>Type</th><th>Prix/Nuit</th><th>Statut</th></tr>
                        </thead>
                        <tbody>
                        <tr th:each="c : ${hotel.chambres}">
                            <td th:text="${c.numero}"></td>
                            <td th:text="${c.type}"></td>
                            <td th:text="${c.prixParNuit} + ' €'"></td>
                            <td>
                                <span th:if="${c.disponible}" class="badge text-bg-success">Disponible</span>
                                <span th:unless="${c.disponible}" class="badge text-bg-danger">Occupée</span>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div class="mt-3 d-flex gap-2">
        <a th:href="@{/hotels/modifier/{id}(id=${hotel.id})}" class="btn btn-warning">
            <i class="fas fa-edit me-1"></i>Modifier
        </a>
        <a th:href="@{/hotels/supprimer/{id}(id=${hotel.id})}" class="btn btn-danger"
           onclick="return confirm('Supprimer cet hôtel et toutes ses chambres ?')">
            <i class="fas fa-trash me-1"></i>Supprimer
        </a>
    </div>
</section>
</body>
</html>
